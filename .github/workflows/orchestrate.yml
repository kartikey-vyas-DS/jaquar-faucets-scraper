name: Scrape All Faucets (Orchestrator)

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Start from series index (0 = beginning, useful for resuming)"
        required: false
        default: "0"

jobs:
  # ── List all series so the summary is visible ────────────────────────────────
  list-series:
    name: "List all series"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/jaquar_scraper.py --list-series

  # ── One job per series — sequential via needs: ────────────────────────────────
  # Each job depends on the previous completing successfully (or being skipped).
  # If a job fails, subsequent jobs are skipped and you can re-run from that index.

  s00-fusion-prime:
    name: "00 Fusion Prime"
    needs: list-series
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "0"

  s01-florentine-prime:
    name: "01 Florentine Prime"
    needs: s00-fusion-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "1"

  s02-laguna:
    name: "02 Laguna"
    needs: s01-florentine-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "2"

  s03-continental-prime:
    name: "03 Continental Prime"
    needs: s02-laguna
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "3"

  s04-blush-sensor:
    name: "04 Blush Sensor Faucets"
    needs: s03-continental-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "4"

  s05-queens-prime:
    name: "05 Queen's Prime"
    needs: s04-blush-sensor
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "5"

  s06-arc:
    name: "06 Arc"
    needs: s05-queens-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "6"

  s07-kubix-prime:
    name: "07 Kubix Prime"
    needs: s06-arc
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "7"

  s08-opal-prime:
    name: "08 Opal Prime"
    needs: s07-kubix-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "8"

  s09-ornamix-prime:
    name: "09 Ornamix Prime"
    needs: s08-opal-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "9"

  s10-alive:
    name: "10 Alive"
    needs: s09-ornamix-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "10"

  s11-queens:
    name: "11 Queen's"
    needs: s10-alive
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "11"

  s12-lyric:
    name: "12 Lyric"
    needs: s11-queens
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "12"

  s13-aria:
    name: "13 Aria"
    needs: s12-lyric
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "13"

  s14-vignette-prime:
    name: "14 Vignette Prime"
    needs: s13-aria
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "14"

  s15-fusion:
    name: "15 Fusion"
    needs: s14-vignette-prime
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "15"

  s16-solo:
    name: "16 Solo"
    needs: s15-fusion
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "16"

  s17-clarion:
    name: "17 Clarion"
    needs: s16-solo
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "17"

  s18-floor-standing:
    name: "18 Floor Standing Mixer"
    needs: s17-clarion
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "18"

  s19-sensor-faucets:
    name: "19 Sensor Faucets"
    needs: s18-floor-standing
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "19"

  s20-new-age-pressmatic:
    name: "20 New Age Pressmatic"
    needs: s19-sensor-faucets
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "20"

  s21-pressmatic-taps:
    name: "21 Pressmatic Taps"
    needs: s20-new-age-pressmatic
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "21"

  s22-medi-series:
    name: "22 Medi Series"
    needs: s21-pressmatic-taps
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "22"

  s23-spout-operating:
    name: "23 Spout Operating Tap"
    needs: s22-medi-series
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "23"

  s24-bathtub-spouts:
    name: "24 Bathtub Spouts"
    needs: s23-spout-operating
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "24"

  s25-allied:
    name: "25 Allied"
    needs: s24-bathtub-spouts
    uses: ./.github/workflows/scrape_series.yml
    with:
      series_index: "25"

  # ── Final merge step ─────────────────────────────────────────────────────────
  merge-all-csvs:
    name: "Merge all CSVs → jaquar_faucets_complete.csv"
    runs-on: ubuntu-latest
    needs:
      - s25-allied
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge CSVs
        run: |
          python3 - << 'EOF'
          import csv, os, glob

          output_file = "data/jaquar_faucets_complete.csv"
          csv_files   = sorted(glob.glob("data/*.csv"))

          # Exclude the combined file itself if re-running
          csv_files = [f for f in csv_files if "complete" not in f]

          if not csv_files:
              print("No CSV files found in data/")
              exit(1)

          header_written = False
          total_rows     = 0

          with open(output_file, "w", newline="", encoding="utf-8-sig") as outf:
              writer = None
              for filepath in csv_files:
                  print(f"Merging: {filepath}")
                  with open(filepath, "r", encoding="utf-8-sig") as inf:
                      reader = csv.DictReader(inf)
                      if writer is None:
                          writer = csv.DictWriter(outf, fieldnames=reader.fieldnames)
                          writer.writeheader()
                      for row in reader:
                          writer.writerow(row)
                          total_rows += 1

          print(f"\nTotal rows written: {total_rows}")
          print(f"Output: {output_file}")
          EOF

      - name: Commit merged CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jaquar_faucets_complete.csv
          git diff --cached --quiet || git commit -m "data: merged complete faucets CSV [skip ci]"
          git push

      - name: Upload merged CSV
        uses: actions/upload-artifact@v4
        with:
          name: jaquar-faucets-complete
          path: data/jaquar_faucets_complete.csv
          retention-days: 90
